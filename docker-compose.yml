services:
  heat-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: heat-risk-api:latest
    container_name: heat-risk-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HEAT_MODEL_TYPE=ml
      - HEAT_MODEL_ARTIFACT_DIR=/app/ml/artifacts/heat_model_v1
      - WEATHER_PROVIDER_TYPE=mock
      - DECISION_PROVIDER_TYPE=mock
      - LLM_PROVIDER_TYPE=mock
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
